<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MissatyPlay</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#090b12;
 color:white;
 min-height:100vh;
}
header{
 padding:25px 20px 15px;
 text-align:center;
 background:linear-gradient(135deg,#171b2b,#0b0d14);
}
h1{margin:0;font-size:30px}
.sub{color:#aaa;margin-top:6px}
main{padding:18px;max-width:600px;margin:auto}
.card{
 background:#151923;
 border-radius:22px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 8px 25px #0006;
}
button{
 border:0;
 border-radius:14px;
 padding:13px 17px;
 margin:4px;
 background:#242a3a;
 color:white;
 font-size:15px;
}
button.primary{background:#e96d63}
button:active{transform:scale(.97)}
#cover{
 width:190px;height:190px;
 margin:10px auto 18px;
 border-radius:25px;
 background:linear-gradient(135deg,#e96d63,#762f61);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:65px;
}
#title{text-align:center;font-size:20px;font-weight:bold}
#artist{text-align:center;color:#aaa;margin:5px}
.controls{text-align:center}
.progress{width:100%}
input[type=range]{width:100%}
.filebox{
 border:2px dashed #444b60;
 padding:20px;
 text-align:center;
 border-radius:18px;
}
.playlist div{
 padding:12px;
 border-bottom:1px solid #292d38;
 cursor:pointer;
}
.playlist .active{
 background:#252a39;
 border-radius:10px;
}
.eq{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:10px;
 text-align:center;
}
.eq input{writing-mode:vertical-lr;direction:rtl;height:130px}
.timer{text-align:center}
select{
 background:#242a3a;color:white;
 border:0;border-radius:12px;
 padding:12px;
}
</style>
</head>

<body>

<header>
<h1>🎵 MissatyPlay</h1>
<div class="sub">Seu player de música</div>
</header>

<main>

<div class="card">
<div id="cover">🎵</div>
<div id="title">Nenhuma música</div>
<div id="artist">Escolha suas músicas</div>
<br>
<audio id="audio" controls class="progress"></audio>

<div class="controls">
<button onclick="previous()">⏮️</button>
<button class="primary" onclick="playPause()">▶️ / ⏸️</button>
<button onclick="next()">⏭️</button>
</div>
</div>

<div class="card">
<h3>📁 Minhas músicas</h3>

<div class="filebox">
<input id="files" type="file" accept="audio/*" multiple>
<br><br>
<input id="folder" type="file" accept="audio/*" webkitdirectory multiple>
<p>Selecione músicas ou uma pasta inteira</p>
</div>
</div>

<div class="card">
<h3>🎶 Playlist</h3>
<div id="playlist" class="playlist">
<p>Nenhuma música adicionada.</p>
</div>
</div>

<div class="card">
<h3>🔊 Equalizador</h3>

<div class="eq">
<div>60Hz<br><input class="eqband" type="range" min="-12" max="12" value="0"></div>
<div>250Hz<br><input class="eqband" type="range" min="-12" max="12" value="0"></div>
<div>1kHz<br><input class="eqband" type="range" min="-12" max="12" value="0"></div>
<div>4kHz<br><input class="eqband" type="range" min="-12" max="12" value="0"></div>
<div>12kHz<br><input class="eqband" type="range" min="-12" max="12" value="0"></div>
</div>
</div>

<div class="card timer">
<h3>⏱️ Temporizador</h3>
<select id="timer">
<option value="0">Desligado</option>
<option value="15">15 minutos</option>
<option value="30">30 minutos</option>
<option value="45">45 minutos</option>
<option value="60">60 minutos</option>
<option value="120">120 minutos</option>
</select>
<p id="timerStatus">Temporizador desligado</p>
</div>

</main>

<script>
const audio=document.getElementById("audio");
const filesInput=document.getElementById("files");
const folderInput=document.getElementById("folder");
const playlistBox=document.getElementById("playlist");
const title=document.getElementById("title");
const artist=document.getElementById("artist");

let songs=[];
let current=-1;
let timerId=null;

let audioCtx;
let source;
let filters=[];

function setupAudio(){
 if(audioCtx)return;

 audioCtx=new (window.AudioContext||window.webkitAudioContext)();

 source=audioCtx.createMediaElementSource(audio);

 const freqs=[60,250,1000,4000,12000];

 filters=freqs.map(f=>{
   const filter=audioCtx.createBiquadFilter();
   filter.type="peaking";
   filter.frequency.value=f;
   filter.Q.value=1;
   filter.gain.value=0;
   return filter;
 });

 let node=source;

 filters.forEach(f=>{
   node.connect(f);
   node=f;
 });

 node.connect(audioCtx.destination);
}

document.querySelectorAll(".eqband").forEach((el,i)=>{
 el.addEventListener("input",()=>{
   setupAudio();
   filters[i].gain.value=Number(el.value);
 });
});

function
