<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misat Music Play</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b12;
 color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
.app{
 max-width:600px;
 margin:auto;
 padding:22px 16px 110px;
}
header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:22px;
}
.logo{
 width:48px;height:48px;border-radius:15px;
 background:linear-gradient(135deg,#ff4f8b,#7b5cff);
 display:flex;align-items:center;justify-content:center;
 font-size:24px;font-weight:bold;
}
h1{font-size:22px;margin:0 0 4px 12px;flex:1}
.sub{color:#8d96a8;font-size:12px}

.card{
 background:linear-gradient(145deg,#151b27,#0e131d);
 border:1px solid #293243;
 border-radius:22px;
 padding:20px;
 margin-bottom:16px;
 box-shadow:0 12px 30px #0005;
}
.cover{
 width:210px;height:210px;
 margin:5px auto 18px;
 border-radius:25px;
 background:linear-gradient(135deg,#ff4f8b,#4c54ff);
 display:flex;align-items:center;justify-content:center;
 font-size:70px;
 box-shadow:0 15px 40px #0008;
}
.song{text-align:center;font-size:20px;font-weight:bold}
.artist{text-align:center;color:#8d96a8;margin-top:6px}

.progress{
 width:100%;margin:18px 0 4px;
}
.times{
 display:flex;justify-content:space-between;
 color:#8993a6;font-size:12px;
}
.controls{
 display:flex;align-items:center;justify-content:center;
 gap:18px;margin-top:15px;
}
button{
 border:0;
 color:white;
 background:#202838;
 border-radius:15px;
 padding:13px 17px;
 font-size:15px;
}
button:active{transform:scale(.96)}
.play{
 width:64px;height:64px;border-radius:50%;
 background:linear-gradient(135deg,#ff4f8b,#765cff);
 font-size:25px;
}
.actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}
.action{
 text-align:center;
 padding:15px 5px;
 border:1px solid #293243;
 border-radius:16px;
 background:#111722;
}
.action span{display:block;font-size:22px;margin-bottom:6px}
.action small{color:#a0a8b7}

input[type=file]{display:none}

.playlist{
 max-height:260px;
 overflow:auto;
}
.track{
 display:flex;
 align-items:center;
 gap:12px;
 padding:13px 8px;
 border-bottom:1px solid #222a38;
}
.track:last-child{border:0}
.track button{margin-left:auto;padding:8px 11px}
.track-name{
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}
.eq{
 display:flex;
 align-items:flex-end;
 justify-content:center;
 gap:7px;height:90px;
 margin:10px 0;
}
.bar{
 width:10px;
 border-radius:8px;
 background:linear-gradient(#ff4f8b,#735cff);
 animation:bounce .7s infinite alternate;
}
.bar:nth-child(2){height:55%;animation-delay:.1s}
.bar:nth-child(3){height:80%;animation-delay:.2s}
.bar:nth-child(4){height:40%;animation-delay:.3s}
.bar:nth-child(5){height:70%;animation-delay:.15s}
.bar:nth-child(6){height:50%;animation-delay:.25s}
.bar:nth-child(7){height:85%;animation-delay:.35s}
@keyframes bounce{to{transform:scaleY(.45)}}

.timer{
 display:flex;gap:10px;align-items:center;
}
.timer input{
 width:90px;
 padding:12px;
 border:1px solid #344055;
 border-radius:12px;
 background:#0b1019;
 color:white;
}
footer{
 position:fixed;
 bottom:0;left:0;right:0;
 background:#0c1018ee;
 backdrop-filter:blur(15px);
 border-top:1px solid #273042;
 padding:12px 16px;
 text-align:center;
 color:#737d90;font-size:11px;
}
/* ===== NOVO VISUAL MISAT MUSIC PLAY ===== */

body{
  background:#090d14;
  color:#f5f7fa;
  font-family:Arial,sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  padding:20px 16px 100px;
}

header{
  padding:8px 0 20px;
}

.logo{
  width:52px;
  height:52px;
  border-radius:16px;
  background:linear-gradient(135deg,#19d3c5,#1479ff);
  box-shadow:0 8px 25px rgba(20,121,255,.25);
}

.card,
.player,
.controls,
.song-list,
.equalizer,
.timer{
  background:#111925;
  border:1px solid #253143;
  border-radius:22px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}

button{
  border:0;
  border-radius:16px;
  padding:12px 16px;
  background:#182435;
  color:#fff;
  font-size:15px;
}

button:active{
  transform:scale(.97);
}

input[type="range"]{
  width:100%;
  accent-color:#19d3c5;
}

h1,h2,h3{
  color:#fff;
}

.player{
  padding:22px;
  margin-top:18px;
}

.song-list{
  padding:10px;
  margin-top:18px;
}

.song-list button{
  width:100%;
  margin:5px 0;
  text-align:left;
}

.equalizer,
.timer{
  padding:18px;
  margin-top:18px;
}

footer{
  background:#0d141f;
  border-top:1px solid #253143;
 }</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">M</div>
<h1>Misat Music Play<div class="sub">Seu player de músicas</div></h1>
<button onclick="document.getElementById('files').click()">＋</button>
</header>

<div class="card">

<div class="cover">♫</div>

<div class="song" id="songName">Nenhuma música</div>
<div class="artist" id="artist">Escolha suas músicas</div>

<audio id="audio" preload="metadata"></audio>

<input id="progress" class="progress" type="range" min="0" max="100" value="0">

<div class="times">
<span id="current">0:00</span>
<span id="duration">0:00</span>
</div>

<div class="controls">
<button onclick="previous()">⏮</button>
<button class="play" onclick="togglePlay()" id="play">▶</button>
<button onclick="next()">⏭</button>
</div>

</div>

<div class="card">
<div class="actions">

<label class="action">
<span>📁</span>
<small>Adicionar músicas</small>
<input id="files" type="file" accept="audio/*" multiple>
</label>

<button class="action" onclick="showTimer()">
<span>⏱️</span>
<small>Temporizador</small>
</button>

<button class="action" onclick="showEqualizer()">
<span>🎚️</span>
<small>Equalizador</small>
</button>

</div>
</div>

<div class="card" id="eqCard" style="display:none">
<h3>🎚️ Equalizador</h3>
<p style="color:#8993a6;font-size:13px">
Controle rápido de áudio
</p>
<div class="eq">
<div class="bar" style="height:45%"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
</div>
</div>

<div class="card" id="timerCard" style="display:none">
<h3>⏱️ Temporizador</h3>
<div class="timer">
<input id="minutes" type="number" min="1" placeholder="Minutos">
<button onclick="startTimer()">Iniciar</button>
<button onclick="stopTimer()">Parar</button>
</div>
<p id="timerText" style="color:#8993a6"></p>
</div>

<div class="card">
<h3>🎵 Minhas músicas</h3>
<div class="playlist" id="playlist">
<div style="color:#8993a6;padding:15px 5px">
Adicione suas músicas para começar.
</div>
</div>
</div>

</div>

<footer>Misat Music Play • Reprodução contínua</footer>

<script>
const audio=document.getElementById("audio");
const files=document.getElementById("files");
const playlist=document.getElementById("playlist");
const songName=document.getElementById("songName");
const artist=document.getElementById("artist");
const progress=document.getElementById("progress");
const current=document.getElementById("current");
const duration=document.getElementById("duration");
const play=document.getElementById("play");

let songs=[];
let index=0;
let timer=null;

files.addEventListener("change",e=>{
 songs=[...e.target.files].map(file=>({
   file,
   url:URL.createObjectURL(file)
 }));
 index=0;
 renderPlaylist();
 if(songs.length) loadSong(0);
});

function renderPlaylist(){
 playlist.innerHTML="";
 songs.forEach((s,i)=>{
   const row=document.createElement("div");
   row.className="track";
   row.innerHTML=`
   <span>🎵</span>
   <div class="track-name">${escapeHtml(s.file.name)}</div>
   <button onclick="loadSong(${i});playSong()">▶</button>`;
   playlist.appendChild(row);
 });
}

function escapeHtml(text){
 return text.replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#039;"
 }[m]));
}

function loadSong(i){
 if(!songs.length)return;
 index=(i+songs.length)%songs.length;
 const s=songs[index];

 audio.src=s.url;
 songName.textContent=s.file.name.replace(/\.[^/.]+$/,"");
 artist.textContent="Misat Music Play";
 progress.value=0;

 audio.load();

 if("mediaSession" in navigator){
   navigator.mediaSession.metadata=new MediaMetadata({
     title:songName.textContent,
     artist:"Misat Music Play"
   });
 }
}

function playSong(){
 audio.play();
 play.textContent="⏸";
}

function togglePlay(){
 if(!songs.length){
   document.getElementById("files").click();
   return;
 }
 if(audio.paused)playSong();
 else{
   audio.pause();
   play.textContent="▶";
 }
}

function next(){
 if(!songs.length)return;
 index=(index+1)%songs.length;
 loadSong(index);
 playSong();
}

function previous(){
 if(!songs.length)return;
 index=(index-1+songs.length)%songs.length;
 loadSong(index);
 playSong();
}

/* Reprodução contínua */
audio.addEventListener("ended",()=>{
 next();
});

audio.addEventListener("play",()=>{
 play.textContent="⏸";
});

audio.addEventListener("pause",()=>{
 play.textContent="▶";
});

audio.addEventListener("loadedmetadata",()=>{
 duration.textContent=format(audio.duration);
});

audio.addEventListener("timeupdate",()=>{
 if(audio.duration){
   progress.value=(audio.currentTime/audio.duration)*100;
 }
 current.textContent=format(audio.currentTime);
});

progress.addEventListener("input",()=>{
 if(audio.duration){
   audio.currentTime=(progress.value/100)*audio.duration;
 }
});

function format(sec){
 if(!isFinite(sec))return"0:00";
 let m=Math.floor(sec/60);
 let s=Math.floor(sec%60).toString().padStart(2,"0");
 return `${m}:${s}`;
}

function showTimer(){
 document.getElementById("timerCard").style.display="block";
 document.getElementById("eqCard").style.display="none";
}

function showEqualizer(){
 document.getElementById("eqCard").style.display="block";
 document.getElementById("timerCard").style.display="none";
}

function startTimer(){
 stopTimer();

 const mins=parseInt(document.getElementById("minutes").value);
 if(!mins||mins<1){
   document.getElementById("timerText").textContent="Digite os minutos.";
   return;
 }

 let seconds=mins*60;

 timer=setInterval(()=>{
   seconds--;

   let m=Math.floor(seconds/60);
   let s=String(seconds%60).padStart(2,"0");

   document.getElementById("timerText").textContent=
   `Parando em ${m}:${s}`;

   if(seconds<=0){
     stopTimer();
     audio.pause();
     play.textContent="▶";
     document.getElementById("timerText").textContent=
     "⏹ Reprodução parada.";
   }
 },1000);
}

function stopTimer(){
 if(timer){
   clearInterval(timer);
   timer=null;
 }
 document.getElementById("timerText").textContent="Temporizador parado.";
}

/* Controles da tela bloqueada quando suportados pelo Android/WebView */
if("mediaSession" in navigator){
 navigator.mediaSession.setActionHandler("play",()=>audio.play());
 navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
 navigator.mediaSession.setActionHandler("nexttrack",()=>next());
 navigator.mediaSession.setActionHandler("previoustrack",()=>previous());
}
</script>

</body>
</html>
