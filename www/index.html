<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Misat Music Play</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#070b14;
 color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
.app{
 max-width:720px;
 margin:auto;
 padding:18px 16px 35px;
}
.header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:20px;
}
.brand{
 display:flex;
 align-items:center;
 gap:14px;
}
.logo{
 width:64px;
 height:64px;
 border-radius:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:34px;
 font-weight:bold;
 background:linear-gradient(135deg,#18c9df,#1976ff);
}
h1{
 margin:0;
 font-size:25px;
}
.subtitle{
 color:#8d98ad;
 margin-top:5px;
}
.addTop{
 width:58px;
 height:58px;
 border:0;
 border-radius:19px;
 background:#172238;
 color:white;
 font-size:30px;
}
.card{
 background:#101824;
 border:1px solid #263449;
 border-radius:30px;
 padding:24px;
 box-shadow:0 15px 40px rgba(0,0,0,.25);
}
.cover{
 width:min(100%,390px);
 aspect-ratio:1;
 margin:auto;
 border-radius:30px;
 background:linear-gradient(145deg,#f03d91,#684bff);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:105px;
 box-shadow:0 20px 45px rgba(80,50,180,.3);
}
.song{
 text-align:center;
 margin-top:25px;
}
.song h2{
 margin:0;
 font-size:25px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.artist{
 margin-top:8px;
 color:#929db1;
 font-size:19px;
}
input[type=range]{
 width:100%;
 accent-color:#19c8c5;
}
.time{
 display:flex;
 justify-content:space-between;
 color:#8e99ac;
 margin-top:3px;
}
.controls{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:25px;
 margin-top:22px;
}
.ctrl{
 width:70px;
 height:70px;
 border:0;
 border-radius:22px;
 background:#172238;
 color:#fff;
 font-size:27px;
}
.play{
 width:88px;
 height:88px;
 border-radius:50%;
 background:linear-gradient(135deg,#f13f91,#7650ff);
 font-size:32px;
}
.buttons{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
 margin-top:18px;
}
.action{
 min-height:105px;
 border:1px solid #263449;
 border-radius:22px;
 background:#101824;
 color:#dce2ed;
 font-size:16px;
 padding:12px 7px;
}
.action span{
 display:block;
 font-size:29px;
 margin-bottom:8px;
}
.panel{
 margin-top:18px;
 display:none;
}
.panel.active{display:block}
.panel h3{margin-top:0}
input[type=number]{
 width:100%;
 padding:13px;
 border-radius:12px;
 border:1px solid #34435a;
 background:#0b111c;
 color:white;
 font-size:17px;
}
.eq{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
}
.band{
 text-align:center;
 color:#aab4c5;
 font-size:12px;
}
.band input{
 height:130px;
 writing-mode:vertical-lr;
 direction:rtl;
 width:35px;
}
.playlist{
 margin-top:18px;
}
.playlist h3{margin-bottom:10px}
.track{
 display:flex;
 align-items:center;
 gap:12px;
 padding:13px;
 border-bottom:1px solid #202c3e;
 cursor:pointer;
}
.track.active{
 background:#182338;
 border-radius:12px;
}
.trackIcon{
 width:42px;
 height:42px;
 border-radius:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#ec4292,#6550ff);
}
.trackName{
 flex:1;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}
.footer{
 text-align:center;
 color:#66748a;
 margin-top:25px;
 font-size:13px;
}
.hidden{display:none}
</style>
</head>

<body>
<div class="app">

<header class="header">
 <div class="brand">
  <div class="logo">M</div>
  <div>
   <h1>Misat Music Play</h1>
   <div class="subtitle">Seu player de músicas</div>
  </div>
 </div>

 <button class="addTop" id="addTop">+</button>
</header>

<section class="card">

 <div class="cover">♫</div>

 <div class="song">
  <h2 id="title">Nenhuma música</h2>
  <div class="artist" id="artist">Misat Music Play</div>
 </div>

 <input id="progress" type="range" min="0" max="100" value="0">

 <div class="time">
  <span id="current">0:00</span>
  <span id="duration">0:00</span>
 </div>

 <div class="controls">
  <button class="ctrl" id="prev">⏮</button>
  <button class="ctrl play" id="play">▶</button>
  <button class="ctrl" id="next">⏭</button>
 </div>

</section>

<div class="buttons">

 <button class="action" id="addMusic">
  <span>📁</span>
  Adicionar músicas
 </button>

 <button class="action" id="timerBtn">
  <span>⏱️</span>
  Temporizador
 </button>

 <button class="action" id="eqBtn">
  <span>🎚️</span>
  Equalizador
 </button>

</div>

<input
 id="files"
 class="hidden"
 type="file"
 accept="audio/*"
 multiple
>

<div class="panel" id="timerPanel">
 <div class="card">
  <h3>⏱️ Temporizador</h3>
  <p>Parar a reprodução depois de:</p>

  <input
   id="timerMinutes"
   type="number"
   min="1"
   value="30"
  >

  <button class="action" id="startTimer" style="width:100%;margin-top:12px">
   Iniciar temporizador
  </button>

  <p id="timerStatus"></p>
 </div>
</div>

<div class="panel" id="eqPanel">
 <div class="card">
  <h3>🎚️ Equalizador</h3>

  <div class="eq">

   <div class="band">
    60Hz
    <input type="range" min="-12" max="12" value="0" data-band="0">
   </div>

   <div class="band">
    250Hz
    <input type="range" min="-12" max="12" value="0" data-band="1">
   </div>

   <div class="band">
    1kHz
    <input type="range" min="-12" max="12" value="0" data-band="2">
   </div>

   <div class="band">
    4kHz
    <input type="range" min="-12" max="12" value="0" data-band="3">
   </div>

   <div class="band">
    12kHz
    <input type="range" min="-12" max="12" value="0" data-band="4">
   </div>

  </div>
 </div>
</div>

<section class="playlist card">
 <h3>🎵 Lista de músicas</h3>
 <div id="list">
  <div style="color:#77849a">
   Adicione suas músicas para começar.
  </div>
 </div>
</section>

<div class="footer">
 Misat Music Play • Reprodução contínua
</div>

<audio id="audio" preload="metadata"></audio>

</div>

<script>
const audio = document.getElementById("audio");
const filesInput = document.getElementById("files");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");
const playBtn = document.getElementById("play");
const list = document.getElementById("list");

let tracks = [];
let index = -1;
let timer = null;

let audioCtx = null;
let source = null;
let filters = [];

function formatTime(seconds){
 if(!isFinite(seconds)) return "0:00";
 const m = Math.floor(seconds/60);
 const s = Math.floor(seconds%60).toString().padStart(2,"0");
 return m + ":" + s;
}

function createAudioGraph(){
 if(audioCtx) return;

 audioCtx = new (window.AudioContext || window.webkitAudioContext)();

 source = audioCtx.createMediaElementSource(audio);

 const frequencies = [60,250,1000,4000,12000];

 let previous = source;

 frequencies.forEach(freq=>{
  const filter = audioCtx.createBiquadFilter();
  filter.type = "peaking";
  filter.frequency.value = freq;
  filter.Q.value = 1;
  filter.gain.value = 0;

  previous.connect(filter);
  previous = filter;
  filters.push(filter);
 });

 previous.connect(audioCtx.destination);
}

async function playAudio(){
 if(!tracks.length) return;

 if(audioCtx && audioCtx.state === "suspended"){
  await audioCtx.resume();
 }

 if(!audioCtx){
  try{ createAudioGraph(); }
  catch(e){}
 }

 await audio.play();

 playBtn.textContent = "⏸";
 updateMediaSession();
}

function pauseAudio(){
 audio.pause();
 playBtn.textContent = "▶";
}

function loadTrack(i, auto=true){
 if(!tracks.length) return;

 if(i<0) i=tracks.length-1;
 if(i>=tracks.length) i=0;

 index=i;

 const track=tracks[index];

 audio.src=track.url;

 title.textContent=track.name;
 artist.textContent="Misat Music Play";

 renderList();

 if(auto) playAudio();
}

function nextTrack(){
 if(!tracks.length) return;

 index++;

 if(index>=tracks.length){
  index=0;
 }

 loadTrack(index,true);
}

function previousTrack(){
 if(!tracks.length) return;

 if(audio.currentTime>5){
  audio.currentTime=0;
  return;
 }

 index--;

 if(index<0) index=tracks.length-1;

 loadTrack(index,true);
}

function renderList(){
 list.innerHTML="";

 tracks.forEach((track,i)=>{
  const row=document.createElement("div");
  row.className="track"+(i===index?" active":"");

  row.innerHTML=`
   <div class="trackIcon">♫</div>
   <div class="trackName">${escapeHtml(track.name)}</div>
  `;

  row.onclick=()=>loadTrack(i,true);

  list.appendChild(row);
 });
}

function escapeHtml(text){
 const div=document.createElement("div");
 div.textContent=text;
 return div.innerHTML;
}

filesInput.addEventListener("change",()=>{
 const selected=[...filesInput.files];

 selected.forEach(file=>{
  if(!file.type.startsWith("audio/")) return;

  tracks.push({
   name:file.name.replace(/\.[^/.]+$/,""),
   file:file,
   url:URL.createObjectURL(file)
  });
 });

 renderList();

 if(index===-1 && tracks.length){
  loadTrack(0,false);
 }
});

document.getElementById("addMusic").onclick=()=>{
 filesInput.click();
};

document.getElementById("addTop").onclick=()=>{
 filesInput.click();
};

playBtn.onclick=async()=>{
 if(!tracks.length){
  filesInput.click();
  return;
 }

 if(audio.paused){
  await playAudio();
 }else{
  pauseAudio();
 }
};

document.getElementById("next").onclick=nextTrack;
document.getElementById("prev").onclick=previousTrack;

audio.addEventListener("timeupdate",()=>{
 if(audio.duration){
  progress.value=(audio.currentTime/audio.duration)*100;
 }

 current.textContent=formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata",()=>{
 duration.textContent=formatTime(audio.duration);
});

progress.addEventListener("input",()=>{
 if(audio.duration){
  audio.currentTime=(progress.value/100)*audio.duration;
 }
});

audio.addEventListener("ended",()=>{
 nextTrack();
});

document.getElementById("timerBtn").onclick=()=>{
 document.getElementById("timerPanel").classList.toggle("active");
 document.getElementById("eqPanel").classList.remove("active");
};

document.getElementById("eqBtn").onclick=()=>{
 document.getElementById("eqPanel").classList.toggle("active");
 document.getElementById("timerPanel").classList.remove("active");
};

document.getElementById("startTimer").onclick=()=>{
 const minutes=parseInt(
  document.getElementById("timerMinutes").value
 );

 if(!minutes || minutes<1) return;

 clearTimeout(timer);

 timer=setTimeout(()=>{
  pauseAudio();
  document.getElementById("timerStatus").textContent=
   "⏹ Reprodução parada.";
 },minutes*60*1000);

 document.getElementById("timerStatus").textContent=
  "⏱️ Temporizador ativo por "+minutes+" minutos.";
};

document.querySelectorAll(".band input").forEach((control,i)=>{
 control.addEventListener("input",()=>{
  if(!filters[i]) return;
  filters[i].gain.value=parseFloat(control.value);
 });
});

function updateMediaSession(){
 if(!("mediaSession" in navigator)) return;

 navigator.mediaSession.metadata=
  new MediaMetadata({
   title:title.textContent,
   artist:"Misat Music Play",
   album:"Misat Music Play"
  });

 navigator.mediaSession.setActionHandler("play",playAudio);
 navigator.mediaSession.setActionHandler("pause",pauseAudio);
 navigator.mediaSession.setActionHandler("previoustrack",previousTrack);
 navigator.mediaSession.setActionHandler("nexttrack",nextTrack);
}

audio.addEventListener("play",()=>{
 if("mediaSession" in navigator){
  navigator.mediaSession.playbackState="playing";
 }
});

audio.addEventListener("pause",()=>{
 if("mediaSession" in navigator){
  navigator.mediaSession.playbackState="paused";
 }
});
</script>

</body>
    </html>
