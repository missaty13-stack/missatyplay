name: Gerar APK MissatyPlay

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Criar configuração
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.missatyplay.app",
            "appName": "MissatyPlay",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap copy android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MissatyPlay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
